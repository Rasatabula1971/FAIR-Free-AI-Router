[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-free-ai-router"
version = "0.1.0"
description = "Embeddable, free-only AI routing with quality validation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.9,<1",
    "mypy>=1.18,<2",
]

[tool.setuptools.packages.find]
include = ["fair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
