# Candidates stay inactive until the operator verifies account and model eligibility.
# Groq, Gemini, OpenRouter free and local Ollama adapters are available; see docs/LIVE_ADAPTERS.md.
# No quota values or current provider terms are inferred from the source seed.
# Candidate scope follows FAIR_TRUE_FREE_API_ONLY_v2.md; see docs/FREE_PROVIDER_QUALIFICATION.md.
# Access classes describe proposed routes, not verified account eligibility.
# Credit-based Ollama Cloud and Hugging Face routes are excluded from this pool.
providers:
  - {provider_id: groq, access_class: FREE_RECURRING}
  - {provider_id: google_gemini_api, access_class: FREE_RECURRING}
  - {provider_id: cloudflare_workers_ai, access_class: FREE_RECURRING}
  # Mistral Free mode is development-first; production eligibility remains false.
  - {provider_id: mistral, access_class: FREE_RECURRING}
  - {provider_id: kilo_gateway, access_class: FREE_DYNAMIC}
  - {provider_id: openrouter_free, access_class: FREE_DYNAMIC}
  - {provider_id: zai, access_class: FREE_DYNAMIC}
  - {provider_id: ollama_local, access_class: FREE_LOCAL, status: DISABLED}
