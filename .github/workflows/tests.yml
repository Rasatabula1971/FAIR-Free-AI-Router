name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: alembic upgrade head && alembic check
        env:
          FAIR_DATABASE_URL: sqlite:///migration-test.db
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fair
          POSTGRES_PASSWORD: fair
          POSTGRES_DB: fair_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fair -d fair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_migrations.py
        env:
          FAIR_TEST_POSTGRES_URL: postgresql+psycopg://fair:fair@localhost:5432/fair_test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Disposable credentials for this isolated CI stack only.
      FAIR_CLIENT_KEYS: '{"smoke":"ci-smoke-client"}'
      FAIR_ADMIN_KEY: ci-smoke-admin
      FAIR_DEMO_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build and start the packaged application
        run: docker compose -f infra/docker/docker-compose.yml up -d --build
      - name: Verify HTTP routing and persistence across restart
        run: python scripts/docker_smoke.py
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color --tail 150
      - name: Remove the disposable CI stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes --remove-orphans
