name: FAIR Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fair-code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    name: Python static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff
        run: ruff check fair tests
      - name: Ruff format
        run: ruff format --check fair tests
      - name: Mypy
        run: mypy fair

  windows-import:
    name: Windows clean install and import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project with service extras
        run: python -m pip install -e ".[service]"
      - name: Import FAIR and resolve the Pacific zone
        run: python -c "from fair import FAIR; from zoneinfo import ZoneInfo; print(ZoneInfo('America/Los_Angeles'))"

  tests:
    name: Pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        # The threshold is the floor the suite currently clears, not a target.
        # Raise it when coverage rises; never lower it to make a build pass.
        run: >-
          pytest -ra --cov=fair --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Preserve coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  status-page-browser:
    name: Status page in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and Playwright
        run: python -m pip install -e ".[dev]" "playwright>=1.49,<2"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run the page in Chromium
        # The page's script is a string to every other job. A missing browser
        # must fail here rather than skip, or this job would be green and empty.
        env:
          FAIR_REQUIRE_BROWSER: "1"
        run: pytest -ra tests/test_status_page_browser.py

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.9,<3"
      - name: Audit runtime dependencies
        run: pip-audit .

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install "semgrep>=1.100,<2"
      - name: Scan
        run: semgrep scan --config p/python --config p/security-audit --error --sarif --output semgrep.sarif fair
      - name: Preserve Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14
